version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: UTC
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: UTC

  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: UTC
