name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build gardenia-web
    runs-on: ubuntu-latest

    steps:
      - name: Setup
        uses: sisques-labs/workflows/.github/actions/setup@main
        with:
          node_version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild

      - name: Lint code
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:ci

      - name: Build the app
        run: pnpm build
