schema: spec-driven

context: |
  Tech stack: Next.js 16 (App Router, Node server mode), React 19, TypeScript (strict), pnpm@9.15.4
  State: Zustand (in-memory, no persistence except activeSpaceId)
  HTTP: Axios (interceptors for Bearer token + X-Space-ID + 401 refresh mutex)
  GraphQL: Apollo Client v4 (@apollo/client/react)
  Server state / caching: TanStack Query v5
  Forms: React Hook Form + Zod
  UI: shadcn/ui (Radix UI + Tailwind v4) in src/shared/presentation/components/ui/
  Icons: lucide-react
  Architecture: DDD + Hexagonal (Screaming Architecture). Bounded contexts: auth, spaces, shared.
  Layers per context: domain / application / infrastructure / presentation
  Providers: each module owns src/core/{context}/presentation/providers/{context}.providers.tsx;
             shared/presentation/providers/providers.tsx aggregates all module providers.

testing:
  strict_tdd: true
  test_command: "pnpm test"
  coverage_command: "pnpm test:ci"
  e2e_command: "pnpm e2e"
  layers:
    unit: { available: true, tool: "vitest + react testing library" }
    integration: { available: false, note: "pending implementation" }
    e2e: { available: false, tool: "playwright", note: "pending implementation" }
  quality:
    linter: { available: true, command: "pnpm lint" }
    type_checker: { available: true, command: "pnpm tsc --noEmit" }

conventions:
  naming:
    use_cases: "{name}.use-case.ts — file; class exported as {Name}UseCase. Lives in application/use-cases/{name}/."
    repository_ports: "{name}.repository.port.ts"
    repositories: |
      GQL (current standard):
        repository: infrastructure/repositories/graphql/{context}.gql.repository.ts
        queries:   infrastructure/repositories/graphql/queries/{operation-name}.query.ts
        mutations: infrastructure/repositories/graphql/mutations/{operation-name}.mutation.ts
        class: {Context}GqlRepository implements I{Context}Repository
        singleton export: {context}GqlRepository
      REST (legacy — {name}-http.repository.ts, being replaced by GQL)
    screens: "{name}.screen.tsx — file name; component exported as {Name}Screen (PascalCase). No schemas, no business logic inline — import from schemas/ and hooks/."
    skeletons: |
      {name}-skeleton/{name}-skeleton.tsx — loading skeleton for a screen or list.
      Exported as {Name}Skeleton (PascalCase). Lives alongside other components in
      presentation/components/{name}-skeleton/.
      MUST be used as the fallback prop of the <Suspense> that wraps the screen in
      app/[lang]/…/page.tsx. Never define skeletons inline inside a screen component.
    schemas: "{name}.schema.ts — Zod schema + inferred type. Lives in presentation/schemas/."
    hooks: "hooks/{hook-name}/{hook-name}.hook.ts — one folder per hook, kebab-case file name; exported function named use{Name}"
    providers: "{context}.providers.tsx"
    models: "{name}.model.ts"
    interfaces: "{name}.interface.ts"
    value_objects: "{name}.vo.ts"
    stores: "{name}.store.ts (Zustand, in infrastructure/store/)"
    entities: "{name}.entity.ts"
    components: "{name}.tsx (no suffix — shadcn atoms are self-describing)"
  structure:
    app_router: "app/ — Next.js App Router ONLY (pages, layouts, route groups)"
    domain_code: "src/core/{context}/ — DDD layers"
    shared_ui: "src/shared/presentation/components/ui/ — shadcn components"
    shared_lib: "src/shared/lib/ — cn() and other pure utilities"
    shared_http: "src/shared/infrastructure/http/ — axios client, Apollo client, refresh mutex"
    shared_config: "src/shared/config/env.ts — NEXT_PUBLIC_* env constants (GRAPHQL_URL, API_URL)"
    gql_repos: |
      src/core/{context}/infrastructure/repositories/graphql/
        queries/{operation}.query.ts      ← gql`` document, named export
        mutations/{operation}.mutation.ts ← gql`` document, named export
        {context}.gql.repository.ts       ← implements port, imports from queries/ + mutations/
        {context}.gql.repository.spec.ts  ← unit tests; mock apolloClient directly (vi.mock)
    shared_providers: "src/shared/presentation/providers/ — provider aggregator"
  layers:
    domain:
      - Pure TypeScript — zero framework imports
      - interfaces/ for DTOs and contracts
      - models/ for domain models
    application:
      - use-cases/{name}/ — one folder per use case
      - ports/ — repository interfaces
      - interfaces/ — application-level input/output interfaces (e.g. use-case input DTOs)
      - Use-case classes take repository via constructor; exported as module singletons
      - Class name: {Name}UseCase. File name: {name}.use-case.ts
      - No framework imports (no React, no Zustand direct) — reads/writes store via getState()
    infrastructure:
      - repositories/graphql/ — Apollo GQL implementations of ports (current standard)
      - repositories/graphql/queries/ — gql document files ({name}.query.ts), one per query
      - repositories/graphql/mutations/ — gql document files ({name}.mutation.ts), one per mutation
      - repositories/ — legacy Axios HTTP repos (being phased out via rest-to-graphql change)
      - store/ — Zustand stores (framework-coupled, lives here not in application)
      - http/ — shared HTTP utilities (axios client, Apollo client, refresh mutex)
    presentation:
      - screens/ — React page components ('use client', React Hook Form)
      - hooks/ — TanStack Query useMutation/useQuery wrappers
      - providers/ — React context providers for the module
  cross_layer_rules:
    - domain must never import from application, infrastructure, or presentation
    - application use-cases may import domain + infrastructure/store (via getState only)
    - infrastructure may import domain + shared http
    - presentation may import application use-cases, infrastructure/store, domain interfaces

git:
  base_branch: main
  strategy: "feature branches → PR → main"
  commits: "Conventional Commits, free scope. No AI attribution."
  pr_size_limit: 400

docker:
  strategy: "2-stage build — node:24-bookworm-slim builder → node:24-bookworm-slim runner"
  output: "Next.js standalone (output: 'standalone' in next.config.ts)"
  runner_cmd: "node server.js (no pnpm, no next start — standalone includes its own server)"
  port: 3000

rules:
  proposal:
    - Identify all bounded contexts impacted
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Respect DDD + Hexagonal layering — no cross-layer violations
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - PRs must stay under 400 lines — split into chained PRs if needed
  apply:
    - Follow DDD + Hexagonal patterns per bounded context
    - Use-cases live in application/use-cases/{name}/; one class per use case
    - Repository interfaces (ports) in application/ports/; implementations in infrastructure/repositories/
    - Zustand stores in infrastructure/store/ (not application — they're framework-coupled)
    - Screens in presentation/screens/{name}/; React + React Hook Form + Zod
    - Hooks in presentation/hooks/; wrap TanStack Query mutations/queries
    - Shared atomic components in src/shared/presentation/components/ui/ — shadcn pattern
    - Value objects in domain/value-objects/ using {name}.vo.ts
    - Tests co-located (.spec.ts next to source file). Write RED first, then GREEN.
    - No barrel index.ts files unless the module explicitly needs a public API surface
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    typecheck_command: "pnpm tsc --noEmit"
  archive:
    - Warn before merging destructive deltas

i18n:
  strategy: "Custom TypeScript — no external library"
  format: "TypeScript files with 'as const' (not JSON)"
  locales: [en, es]
  default_locale: en
  routing: "app/[lang]/ — URL-based locale segment"
  structure_per_module: "src/core/{module}/presentation/i18n/en.ts + es.ts"
  aggregator: "src/shared/presentation/i18n/get-dictionary.ts — imports all module dicts, exports getDictionary(locale)"
  passing: "Server component calls getDictionary(locale), passes dict slice as prop to client screen"
  naming:
    file: "en.ts / es.ts per module"
    keys: "camelCase, nested by screen/context"
    type: "{Module}Dict exported from en.ts; es.ts uses 'satisfies WidenStringLiterals<{Module}Dict>'"
  spanish_variant: "Castellano de España — tuteo (tú/usted), vocabulario peninsular. No usar voseo ni regionalismos latinoamericanos."
  testing: "i18n-parity.test.ts per module — validates every key exists in both locales"
  adding_module: |
    1. Create src/core/{module}/presentation/i18n/en.ts (as const + export type {Module}Dict)
    2. Create src/core/{module}/presentation/i18n/es.ts (satisfies WidenStringLiterals<{Module}Dict>)
    3. Create src/core/{module}/presentation/i18n/i18n-parity.test.ts
    4. Add import + entry in src/shared/presentation/i18n/get-dictionary.ts
    5. Pass dict slice as prop in app/[lang]/...page.tsx
