<div class="app-textarea">
  @if (label()) {
    <label
      [for]="textareaId"
      class="app-textarea__label"
    >
      {{ label() }}
      @if (required()) {
        <span class="app-textarea__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <textarea
    [id]="textareaId"
    [placeholder]="placeholder()"
    [rows]="rows()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="errorMessage() ? 'true' : null"
    [attr.aria-describedby]="errorMessage() ? errorId : (hint() ? hintId : null)"
    [value]="value()"
    class="app-textarea__field"
    [class.app-textarea__field--error]="errorMessage()"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  ></textarea>

  @if (errorMessage()) {
    <p [id]="errorId" class="app-textarea__error" role="alert">
      {{ errorMessage() }}
    </p>
  } @else if (hint()) {
    <p [id]="hintId" class="app-textarea__hint">
      {{ hint() }}
    </p>
  }
</div>
