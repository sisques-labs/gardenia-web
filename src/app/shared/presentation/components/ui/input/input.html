<div class="app-input">
  @if (label()) {
    <label
      [for]="inputId"
      class="app-input__label"
    >
      {{ label() }}
      @if (required()) {
        <span class="app-input__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <input
    [id]="inputId"
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="errorMessage() ? 'true' : null"
    [attr.aria-describedby]="errorMessage() ? errorId : (hint() ? hintId : null)"
    [value]="value()"
    class="app-input__field"
    [class.app-input__field--error]="errorMessage()"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />

  @if (errorMessage()) {
    <p [id]="errorId" class="app-input__error" role="alert">
      {{ errorMessage() }}
    </p>
  } @else if (hint()) {
    <p [id]="hintId" class="app-input__hint">
      {{ hint() }}
    </p>
  }
</div>
