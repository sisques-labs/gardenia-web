<div class="app-select">
  @if (label()) {
    <label [for]="selectId" class="app-select__label">
      {{ label() }}
    </label>
  }

  <select
    [id]="selectId"
    [disabled]="disabled()"
    [attr.aria-invalid]="errorMessage() ? 'true' : null"
    [attr.aria-describedby]="errorMessage() ? errorId : null"
    class="app-select__field"
    [class.app-select__field--error]="errorMessage()"
    (change)="handleChange($event)"
    (blur)="handleBlur()"
  >
    @if (placeholder()) {
      <option value="">{{ placeholder() }}</option>
    }
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
  </select>

  @if (errorMessage()) {
    <p [id]="errorId" class="app-select__error" role="alert">
      {{ errorMessage() }}
    </p>
  }
</div>
